# Pharmacy ERP — web frontend in a nonroot distroless container.
# The web app talks to the self-hosted Supabase API directly (RLS-scoped);
# there is no separate backend service in production.
# Web is served through the VPS Traefik (network traefik_web, Cloudflare TLS).
#
# CI/CD: deployed by the GitHub Actions Container security workflow.
#
# Build-time: NEXT_PUBLIC_SUPABASE_* are inlined into the web client bundle.
# Runtime:    the Supabase server client reads the same vars from env.
# Secrets live in .env (VPS-side), never committed.
#
# Deploy flow (GitHub Actions): CI builds and pushes the images to Docker Hub
# under ${DOCKERHUB_USERNAME}, then the VPS runs `docker compose pull` and
# `docker compose up -d`. Set DOCKERHUB_USERNAME in .env on the VPS (and in
# your local .env if you build via compose).

networks:
  traefik_web:
    external: true

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/pharmacy-erp-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      # Keep the build-time NEXT_PUBLIC_* for the server client; the
      # .env file also supplies them, but this is an explicit guard.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # Server-side Supabase calls use the in-VPS Kong endpoint (same Docker
      # network) to skip the public DNS + Cloudflare round trip. Unset =
      # fall back to the public URL (local dev).
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    networks:
      - traefik_web
    labels:
      - "traefik.docker.network=traefik_web"
      - "traefik.enable=true"
      - "traefik.http.routers.pharmacy-web.entrypoints=websecure"
      - "traefik.http.routers.pharmacy-web.rule=Host(`pharmacy.nmrooms.biz.id`)"
      - "traefik.http.routers.pharmacy-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.pharmacy-web.loadbalancer.server.port=3000"
    # Health probe uses Node itself — distroless has no curl/wget.
    # / redirects to login (307) for anonymous users, which is healthy.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
