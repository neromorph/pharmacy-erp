# One pipeline for the whole repo: lint, tests, builds, dependency
# review, secret scanning (Gitleaks), SAST (CodeQL), container security
# (Hadolint/Trivy/SBOM), Docker Hub publish + attestation, and VPS deploy.
#
# Triggers:
#   - push to main: everything, incl. image publish + deploy
#   - pull_request: checks only (no image build, no deploy)
#   - schedule (Monday 03:00 UTC) and workflow_dispatch: full run
#
# Deploy happens ONLY through this pipeline (never rsync or local builds).
# The runner joins the tailnet and SSHes to the VPS to run
# `docker compose pull && docker compose up -d`. See AGENTS.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Full URL of a deployed TEST/STAGING instance to scan (DAST); empty skips DAST'
        required: false
        default: ''
      scan_type:
        description: 'baseline (passive, safe) or full (active)'
        type: choice
        options:
          - baseline
          - full
        default: baseline

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.18.0'

jobs:
  quality:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (tsc --noEmit)
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  build:
    name: Build all workspaces
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false' # do not post comments on PRs

  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to Code Scanning
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none # JS/TS analysis needs no build
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Set the SEMGREP_APP_TOKEN secret to publish findings to Semgrep App;
      # without it, results still go to GitHub Code Scanning as SARIF.
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default
          publish_token: ${{ secrets.SEMGREP_APP_TOKEN }}

  hadolint:
    name: Hadolint ${{ matrix.component }} Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # DL3006 is ignored: the distroless runtime base (nodejs24-debian13)
      # has no versioned tags — only the rolling stable tag.
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: warning
          ignore: DL3006

  trivy-fs:
    name: Trivy lockfile scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lockfile (dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          ignore-unfixed: true # skip CVEs with no fixed version available
          severity: CRITICAL,HIGH
          exit-code: '1'

  trivy-config:
    name: Trivy IaC misconfig scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one target failing must not cancel the others
      matrix:
        target: [apps/web/Dockerfile, compose.yaml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan ${{ matrix.target }} (misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.target }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  build-scan-publish:
    name: Build, scan, SBOM, publish (${{ matrix.component }})
    if: github.event_name != 'pull_request' # no image build on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # attestation
      attestations: write # attestation
    strategy:
      fail-fast: false # one component failing must not cancel the other
      matrix:
        component: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Docker Hub image name
        run: |
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-erp-${{ matrix.component }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # build-args are only consumed by apps/web/Dockerfile.
      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          ignore-unfixed: true # skip CVEs with no fixed version available
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Attest image provenance
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest SBOM provenance
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom-${{ matrix.component }}.spdx.json
          subject-name: pharmacy-erp-${{ matrix.component }}-sbom

  deploy:
    name: Deploy to VPS (compose pull + up)
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
    needs: build-scan-publish
    runs-on: ubuntu-latest
    environment: production # add required reviewers here for approval gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Join the tailnet so the runner can SSH to the VPS over Tailscale.
      # Setup: create tag:github-actions and an OAuth client in the
      # Tailscale admin console; store TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET
      # as repository secrets. ACL must allow tag:github-actions to reach
      # the VPS on port 22.
      - name: Connect runner to tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Pull on VPS and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '100.119.164.5' }}
          VPS_USER: ${{ secrets.VPS_USER || 'mufid' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/home/mufid/pharmacy-erp' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Pin the VPS host key (no trust-on-first-use).
          printf '%s\n' \
            "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB8HZX3RuuDizXpZ9RzDQ93WrhoFp7PUeTK/Xoh8XczO" \
            > "$HOME/.ssh/known_hosts"
          # Ship the repo compose.yaml so the VPS compose stays in sync.
          scp -i "$HOME/.ssh/deploy_key" compose.yaml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_DIR/compose.yaml"
          ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_DIR' && docker compose pull && docker compose up -d && docker image prune -af --filter 'until=168h'"

  # k6-load-test:
  #   name: k6 load test (staging)
  #   if: github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - name: Run k6 load test
  #       uses: grafana/k6-action@v0.5.1 # pin SHA before enabling
  #       with:
  #         filename: load-tests/smoke.js
  #         flags: --vus 50 --duration 2m
  #       env:
  #         TARGET_URL: ${{ inputs.target_url }}
  #
  # Enable by: (1) uncommenting, (2) adding load-tests/smoke.js,
  # (3) pinning grafana/k6-action to a commit SHA.

  zap:
    name: OWASP ZAP ${{ inputs.scan_type }}
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # ZAP action files alerts as GitHub issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZAP baseline scan
        if: inputs.scan_type == 'baseline'
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true # fail the job when ZAP reports alerts
          allow_issue_writing: true # keep alerts as GitHub issues
          artifact_name: zap-baseline
      - name: ZAP full scan
        if: inputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@bee4e5be916301228d2b1b2dcad73aab6fa6a25b # v0.13.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true # fail the job when ZAP reports alerts
          allow_issue_writing: true # keep alerts as GitHub issues
          artifact_name: zap-full