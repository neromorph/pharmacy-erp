# Container security: Dockerfile lint, lockfile/dockerfile/compose scans,
# image build + scan + SBOM, and (on main) Docker Hub publish + attestation.
#
# Gates:
#   - Trivy image/fs/config: fail on CRITICAL + HIGH
#   - Hadolint: fail on WARNING and above
# Baseline (verified locally before enabling):
#   - pnpm-lock.yaml: 0 HIGH/CRITICAL
#   - Dockerfiles: 0 HIGH/CRITICAL misconfigs
#   - distroless nodejs24 runtime base: 0 HIGH/CRITICAL
#
# Docker Hub publish requires secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# The web image build inlines NEXT_PUBLIC_SUPABASE_URL / ANON_KEY — store
# them as repository secrets so the published image is usable.

name: Container security

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/Dockerfile'
      - 'apps/api/Dockerfile'
      - 'compose.yaml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
  pull_request:
    paths:
      - 'apps/web/Dockerfile'
      - 'apps/api/Dockerfile'
      - 'compose.yaml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.18.0'

jobs:
  hadolint:
    name: Hadolint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: apps/api/Dockerfile
          failure-threshold: warning

  trivy-fs-config:
    name: Trivy filesystem and IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lockfile (dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan web Dockerfile (misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: apps/web/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan API Dockerfile (misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: apps/api/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan compose.yaml (misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: compose.yaml
          severity: CRITICAL,HIGH
          exit-code: '1'

  build-scan-publish:
    name: Build, scan, SBOM, publish
    if: github.event_name != 'pull_request' # no image build on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # attestation
      attestations: write # attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Docker Hub image names
        run: |
          echo "IMAGE_WEB=${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-erp-web" >> "$GITHUB_ENV"
          echo "IMAGE_API=${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-erp-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build web image
        id: build-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
          load: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_WEB }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Build API image
        id: build-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
          load: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_API }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Generate web SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_WEB }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: Generate API SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_API }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest web SBOM provenance
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom-web.spdx.json
          subject-name: pharmacy-erp-web-sbom

      - name: Attest API SBOM provenance
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom-api.spdx.json
          subject-name: pharmacy-erp-api-sbom

  deploy:
    name: Deploy to VPS (compose pull + up)
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
    needs: build-scan-publish
    runs-on: ubuntu-latest
    environment: production # add required reviewers here for approval gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Join the tailnet so the runner can SSH to the VPS over Tailscale.
      # Setup: create tag:github-actions and an OAuth client in the
      # Tailscale admin console; store TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET
      # as repository secrets. ACL must allow tag:github-actions to reach
      # the VPS on port 22.
      - name: Connect runner to tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Pull on VPS and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '100.119.164.5' }}
          VPS_USER: ${{ secrets.VPS_USER || 'mufid' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/home/mufid/pharmacy-erp' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Pin the VPS host key (no trust-on-first-use).
          printf '%s\n' \
            "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB8HZX3RuuDizXpZ9RzDQ93WrhoFp7PUeTK/Xoh8XczO" \
            > "$HOME/.ssh/known_hosts"
          # Ship the repo compose.yaml so the VPS compose stays in sync.
          scp -i "$HOME/.ssh/deploy_key" compose.yaml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_DIR/compose.yaml"
          ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_DIR' && docker compose pull && docker compose up -d"
