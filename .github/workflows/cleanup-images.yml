# Cleanup old Docker Hub SHA tags + runner cache.
# Keeps `latest` and the N most recent SHA tags per image, deletes the rest.
# - Schedule: Sundays 04:00 UTC (after Monday CI, before next cycle)
# - Manual: workflow_dispatch with keep + dry-run inputs
# - Uses Docker Hub API (needs DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets)

name: Cleanup Images

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: 'Recent SHA tags to keep per image (latest always kept)'
        required: false
        default: '10'
      dry_run:
        description: 'Dry run — list only, do not delete'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cleanup-images
  cancel-in-progress: false

env:
  KEEP: ${{ inputs.keep || '10' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  dockerhub:
    name: Docker Hub (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [pharmacy-erp-web]
    steps:
      - name: Delete old tags (keep latest + last ${{ env.KEEP }} SHA)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not set — skip."
            exit 0
          fi

          # Login to get JWT
          TOKEN=$(curl -sf -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Docker Hub login failed"
            exit 1
          fi

          REPO="$DOCKERHUB_USERNAME/$IMAGE"
          KEEP="${KEEP:-10}"
          DRY_RUN="${DRY_RUN:-false}"
          echo "Repo: $REPO | keep: $KEEP SHA + latest | dry_run: $DRY_RUN"

          # List tags (paginated, 100/page, sorted by last_updated desc via API is not guaranteed
          # so we sort locally). Collect name + last_updated.
          PAGE=1
          TMP=$(mktemp)
          while true; do
            RES=$(curl -sf -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100&page=$PAGE&ordering=last_updated")
            COUNT=$(echo "$RES" | jq -r '.results | length')
            echo "$RES" | jq -r '.results[] | "\(.last_updated) \(.name)"' >> "$TMP"
            HAS_NEXT=$(echo "$RES" | jq -r '.next // empty')
            if [ -z "$HAS_NEXT" ] || [ "$COUNT" -eq 0 ]; then break; fi
            PAGE=$((PAGE + 1))
          done

          if [ ! -s "$TMP" ]; then echo "No tags found."; exit 0; fi

          # Keep `latest` always; keep KEEP most recent SHA tags (40-char hex, pushed by CI).
          # Everything else older than those is deleted.
          sort -r "$TMP" > "$TMP.sorted"
          echo "--- All tags (newest first) ---"
          cat "$TMP.sorted"

          # Build keep set
          KEEP_FILE=$(mktemp)
          echo "latest" >> "$KEEP_FILE"
          grep -E ' [0-9a-f]{40}$' "$TMP.sorted" | head -n "$KEEP" | awk '{print $2}' >> "$KEEP_FILE" || true
          echo "--- Keep set ---"
          cat "$KEEP_FILE"

          DELETED=0
          SKIPPED=0
          while read -r UPDATED TAG; do
            if grep -qx "$TAG" "$KEEP_FILE"; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # Only delete SHA tags (CI pushes SHA + latest). Never delete `latest` or non-SHA tags blindly
            # unless they are clearly old SHA-like. Skip non-SHA tags to be safe.
            if ! echo "$TAG" | grep -qE '^[0-9a-f]{40}$'; then
              echo "skip non-SHA tag: $TAG"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete $REPO:$TAG (updated $UPDATED)"
            else
              echo "delete $REPO:$TAG (updated $UPDATED)"
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/$REPO/tags/$TAG/")
              if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
                echo "  deleted ($HTTP)"
                DELETED=$((DELETED + 1))
              else
                echo "::warning::delete $TAG failed: HTTP $HTTP"
              fi
              sleep 0.5 # avoid rate limit
            fi
          done < "$TMP.sorted"
          echo "Done. kept=$SKIPPED deleted=$DELETED (dry_run=$DRY_RUN)"

  actions-cache:
    name: Actions cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # delete caches
    steps:
      - name: Prune caches older than 7 days
        uses: actions/github-script@ed597411d8f924073f98dfc40be365d85b863440 # v8.0.0
        with:
          script: |
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            // paginate returns { data: { actions_caches }} per page — flatten
            let all = [];
            // getActionsCacheList paginate helper returns array of responses
            // fallback: single call
            if (Array.isArray(caches) && caches[0]?.data) {
              all = caches.flatMap(r => r.data.actions_caches);
            } else if (caches.actions_caches) {
              all = caches.actions_caches;
            }
            // If paginate didn't work, do one direct call
            if (all.length === 0) {
              const res = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              all = res.data.actions_caches;
            }
            let deleted = 0;
            for (const c of all) {
              if (new Date(c.last_accessed_at).getTime() < cutoff) {
                console.log(`delete cache ${c.key} (${c.size_in_bytes}B, last ${c.last_accessed_at})`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: c.id,
                });
                deleted++;
              }
            }
            console.log(`Pruned ${deleted}/${all.length} caches older than 7d`);
