# Dependency review: blocks PRs that introduce vulnerable dependencies.
# Fails on newly added HIGH or CRITICAL vulnerabilities.
# The current dependency baseline has no HIGH/CRITICAL findings (verified
# with pnpm audit + trivy on pnpm-lock.yaml), so this threshold is safe.

name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
