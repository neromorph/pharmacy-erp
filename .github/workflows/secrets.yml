# Secret scanning with Gitleaks: repository tree + full git history.
# Runs on every push, every PR, weekly, and on demand.
# Confirmed secrets fail the pipeline. No allowlist is configured.
#
# NOTE: 6 leaked credentials exist in the committed history
# (pharmacy-erp-vault/supabase-deployment.md and docs/supabase-deployment.md).
# This workflow will fail until they are rotated and removed — that is
# intentional. See the manual remediation steps in the DevSecOps report.

name: Secret scanning

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false' # do not post comments on PRs
