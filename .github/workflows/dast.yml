# DAST with OWASP ZAP (manual trigger only).
#
# This repository has no ephemeral test/staging environment, so this
# workflow is opt-in and manual. Point it at a deployed TEST/STAGING
# instance — never at production. ZAP's baseline scan is passive (safe);
# the full scan is active and can alter data.
#
# Required GitHub input at dispatch: target_url.

name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Full URL of a deployed TEST/STAGING instance to scan'
        required: true
      scan_type:
        description: 'baseline (passive, safe) or full (active)'
        type: choice
        options:
          - baseline
          - full
        default: baseline

permissions:
  contents: read

jobs:
  zap:
    name: OWASP ZAP ${{ inputs.scan_type }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ZAP scan
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SCAN_TYPE: ${{ inputs.scan_type }}
        run: |
          docker run --rm -v "$PWD:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            "zap-${SCAN_TYPE}.py" -t "${TARGET_URL}" \
            -r zap-report.html -J zap-report.json
      - name: Upload ZAP report
        if: always() # upload even when the scan fails its threshold
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report-${{ inputs.scan_type }}
          path: zap-report.html
          if-no-files-found: warn
          retention-days: 30
