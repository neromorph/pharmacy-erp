# Dependabot: weekly updates for npm, GitHub Actions, and Docker base images.
# Actions are SHA-pinned in workflows; Dependabot maintains those SHAs.
# npm updates are grouped into a single PR to avoid PR noise.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Asia/Jakarta'
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: 'Asia/Jakarta'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Asia/Jakarta'

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Asia/Jakarta'
